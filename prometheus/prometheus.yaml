global:
  scrape_interval: 15s  # How often to collect metrics

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'perpus_app'
    static_configs:
      - targets: ['perpus_app:8080']  # Change based on your app port

  - job_name: 'perpus_db'
    static_configs:
      - targets: ['perpus_db:3306']  # Change based on your database

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']  # Monitoring system metrics
