version: "3.8"

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name : nginx-proxy
    ports:
      - "443:443"
    networks:
      - monitoring
      - perpus_network
    depends_on:
      - app
      - jenkins
      - grafana
  db:
    image: mysql:5.7
    restart: always
    container_name: perpus_db
    environment:
      MYSQL_DATABASE: 'perpusku_gc'
      MYSQL_USER: 'homestead'
      MYSQL_PASSWORD: 'secret'
      MYSQL_ROOT_PASSWORD: 'secret'
    #ports:
    #  - '3306:3306'
    #expose:
    #  - '3306' comment for restrict public access
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - perpus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost","-psecret"]
      interval: 15s
      retries: 6
      timeout: 5s

  app:
    build:
      context: ./apps/perpus-laravel  # Points to the Laravel directory
      dockerfile: Dockerfile  # Uses the Dockerfile inside perpus-laravel
    container_name: perpus_app
    restart: always
    working_dir: /var/www/html
    #volumes:
    #  - ./apps/perpus-laravel:/var/www/html #comment for avoid overwrite of permission of file
    depends_on:
      db:
        condition: service_healthy
    #ports:
    #  - "8080:80"
    networks:
      - perpus_network
  
  prometheus:
    build:
      context: ./prometheus  # Points to the Laravel directory
      dockerfile: Dockerfile
    container_name: prometheus
    restart: unless-stopped
    #ports:
    #  - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitoring
      - perpus_network
      
  
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    #ports:
    #  - "9100:9100"
    networks:
      - monitoring
    
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    #ports:
    # - "9095:8080"  # Changed from 8080:8080 to your custom port
    privileged: true
    networks:
      - perpus_network

  grafana:
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    #ports:
    #  - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=custom_admin
      - GF_SECURITY_ADMIN_PASSWORD=custom_password
    networks:
      - monitoring
  
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name : jenkins
    env_file: ./jenkins/.env
    #ports:
    #  - "8443:8443"
    #  - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /usr/bin/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --httpPort=-1
      --httpsPort=8443
      --httpsKeyStore=/var/jenkins_home/jenkins_keystore.jks
      --httpsKeyStorePassword=mypassword
    networks:
      - perpus_network

networks:
  perpus_network:
  monitoring:

volumes:
  mysql_data:
  grafana-data:
  prometheus-data:
  jenkins_home:
