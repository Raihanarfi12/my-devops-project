version: "3.8"

services:
  db:
    image: mysql:5.7
    restart: always
    container_name: perpus_db
    environment:
      MYSQL_DATABASE: 'perpusku_gc'
      MYSQL_USER: 'homestead'
      MYSQL_PASSWORD: 'secret'
      MYSQL_ROOT_PASSWORD: 'secret'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      perpus_network:
        aliases:
          - perpus_db.local

  app:
    build:
      context: ./apps/perpus-laravel  # Points to the Laravel directory
      dockerfile: Dockerfile  # Uses the Dockerfile inside perpus-laravel
    container_name: perpus_app
    restart: always
    working_dir: /var/www/html
    #volumes:
    #  - ./apps/perpus-laravel:/var/www/html #comment for avoid overwrite of permission of file
    depends_on:
      - db
    ports:
      - "8080:80"
    networks:
      perpus_network:
        aliases:
          - perpus_app.local
  
  prometheus:
    build:
      context: ./prometheus  # Points to the Laravel directory
      dockerfile: Dockerfile
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      monitoring:
      perpus_network:
        aliases:
          - prometheus.local

    depends_on:
      - app
      - db
  
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring

  grafana:
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=custom_admin
      - GF_SECURITY_ADMIN_PASSWORD=custom_password
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  perpus_network:
  monitoring:

volumes:
  mysql_data:
  grafana-data:
  prometheus-data:
