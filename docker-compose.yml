version: "3.8"

services:
  db:
    image: mysql:5.7
    restart: always
    container_name: perpus_db
    environment:
      MYSQL_DATABASE: 'perpusku_gc'
      MYSQL_USER: 'homestead'
      MYSQL_PASSWORD: 'secret'
      MYSQL_ROOT_PASSWORD: 'secret'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - perpus_network

  app:
    build:
      context: ./apps/perpus-laravel  # Points to the Laravel directory
      dockerfile: Dockerfile  # Uses the Dockerfile inside perpus-laravel
    container_name: perpus_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./apps/perpus-laravel:/var/www/html
    depends_on:
      - db
    ports:
      - "8080:80"
    networks:
      - monitoring
  
  prometheus:
    build: ./prometheus  # Build Prometheus from Dockerfile
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - perpus_network
    depends_on:
      - perpus_app
      - perpus_db
  
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring

  grafana:
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  perpus_network:
  monitoring:

volumes:
  mysql_data:
  grafana-data:
